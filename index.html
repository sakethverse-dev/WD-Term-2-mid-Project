<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Speech to Text Pad</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h2>Speech to Text</h2>
      <p id="status">Not listening</p>

      <textarea id="output" placeholder="Click start and speak"></textarea>

      <div class="buttons">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>

      <button id="save">Save Note</button>

      <ul id="notes"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
